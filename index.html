<!doctype html>
<html lang="pt-BR">
<head>

<title>Novo Layout · Fiscaltech</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
body{margin:0;min-height:100vh;background:#eef2f6;color:#1b2633;font-family:"IBM Plex Sans",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
main{width:min(760px,calc(100vw - 32px));display:flex;flex-direction:column;gap:20px;padding:32px 0}
.b{font:700 13px "Archivo",sans-serif;letter-spacing:.14em;color:#5b6b7c}
h1{font:700 32px "Archivo",sans-serif;margin:0;letter-spacing:-.01em}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:16px;text-decoration:none;color:inherit;
 background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
 border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 28px rgba(30,50,80,.10),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
a:hover{transform:translateY(-3px);background:rgba(255,255,255,.65);box-shadow:0 16px 38px rgba(30,50,80,.15),inset 0 1px 0 rgba(255,255,255,1)}
a:focus-visible{outline:2px solid #1f7fe0;outline-offset:3px}
a b{font:700 19px "Archivo",sans-serif}
a i{font-style:normal;color:#1f7fe0;font-weight:500;font-size:14px;margin-top:4px}
</style>
</head>
<body>
<main>
<div class="b">FISCALTECH</div>

</div>
</main>
</body>
</html>
